# gitleaks 기본 규칙에 더해, 비밀이 아닌 값만 예외로 둔다.
[extend]
useDefault = true

[allowlist]
description = "테스트 서버 가상 비밀번호, 앱 업데이트 서명 공개키(minisign public key)"
regexes = [
  '''dhost-test-pw''',
  # base64("untrusted comment: minisign public key:")로 시작하는 공개키
  '''dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6[A-Za-z0-9+/=]+''',
]
