# v로 시작하는 태그(예: v0.2.0)를 올리면 Apple Silicon용 .dmg와 앱 안 업데이트 파일을 만들어 초안 Release로 올린다.
# 관리자가 초안을 확인하고 Publish하면, 설치된 앱들이 새 버전을 알아챈다 (latest.json).
# 팀 내부 배포용이라 Apple 인증서 서명·공증은 하지 않는다 (ad-hoc 서명). 설치 안내: docs/install.md
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 변경 내용(이전 태그 이후 커밋)을 만들기 위해
      - name: 태그와 앱 버전 일치 확인
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::태그 v$tag 와 src-tauri/tauri.conf.json 버전 $app 이 다릅니다"; exit 1
          fi
          echo "VERSION=$app" >> "$GITHUB_ENV"
      - name: 업데이트 서명 키 확인
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::저장소 Secrets에 TAURI_SIGNING_PRIVATE_KEY가 없습니다 (docs/release.md 참고)"; exit 1
          fi
      - run: scripts/check-secrets.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust 단위 테스트
        working-directory: src-tauri
        run: cargo test --locked
      - name: 앱·.dmg·업데이트 파일 빌드
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg
      - name: 배포 파일 정리
        run: |
          out=dist-release; mkdir -p "$out"
          b=src-tauri/target/release/bundle
          cp "$b"/dmg/*.dmg "$out/"
          upd="DHost_${VERSION}_aarch64.app.tar.gz"
          cp "$b/macos/DHost.app.tar.gz" "$out/$upd"
          cp "$b/macos/DHost.app.tar.gz.sig" "$out/$upd.sig"
          # 변경 내용: 이전 태그 이후 커밋 제목 (첫 배포면 최근 20개)
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="-20 $GITHUB_REF_NAME"; fi
          git log --no-merges --pretty='- %s' $range > notes.md
          node scripts/make-latest-json.mjs "$VERSION" "$upd" "$out/$upd.sig" notes.md > "$out/latest.json"
          (cd "$out" && shasum -a 256 *.dmg *.tar.gz > SHA256SUMS.txt)
          ls -la "$out"; cat "$out/latest.json"
      - name: 초안 Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 변경 내용"; cat notes.md; echo
            echo "## 설치"
            echo "\`DHost_${VERSION}_aarch64.dmg\`를 받아 설치하세요. 처음 설치 방법: docs/install.md"
            echo "이미 설치한 팀원은 앱 아래쪽의 **새 버전 업데이트** 버튼으로 업데이트할 수 있습니다."
          } > body.md
          gh release create "$GITHUB_REF_NAME" dist-release/* \
            --title "DHost $GITHUB_REF_NAME" \
            --notes-file body.md \
            --draft
