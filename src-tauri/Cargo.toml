[package]
name = "dhost"
version = "0.1.0"
description = "DHost - SSH desktop client"
authors = ["dongh94"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "dhost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
portable-pty = "0.9.0"
uuid = { version = "1.29.0", features = ["v4"] }
libc = "0.2.191"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
